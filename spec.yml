spec:
  containers:
    - name: fastapi-app
      image: /fastapi_db/fastapi_schema/fastapi_repo/fastapi-app:latest
      env:
        # SNOWFLAKE_ACCOUNT, SNOWFLAKE_HOST, SNOWFLAKE_DATABASE, SNOWFLAKE_SCHEMA
        # are auto-injected by SPCS — do NOT override them here.
        SNOWFLAKE_WAREHOUSE: fastapi_wh
        SNOWFLAKE_ROLE: fastapi_role
        JWT_SECRET_KEY: CHANGE-ME-in-production
        FIRST_SUPERUSER: admin@example.com
        FIRST_SUPERUSER_PASSWORD: changethis
        # When running in SPCS, use OAuth token-based auth (auto-injected)
        SNOWFLAKE_AUTH_TYPE: oauth
      readinessProbe:
        port: 8000
        path: /api/v1/health
      resources:
        requests:
          cpu: "0.5"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
  endpoints:
    - name: fastapi
      port: 8000
      public: true
