spec:
  containers:
    - name: fastapi-app
      image: /fastapi_db/fastapi_schema/fastapi_repo/fastapi-app:latest
      env:
        SNOWFLAKE_ACCOUNT: LRKEXKW-XEA38443
        SNOWFLAKE_HOST: lrkexkw-xea38443.snowflakecomputing.com
        SNOWFLAKE_DATABASE: fastapi_db
        SNOWFLAKE_SCHEMA: fastapi_schema
        SNOWFLAKE_WAREHOUSE: fastapi_wh
        JWT_SECRET_KEY: CHANGE-ME-in-production
        FIRST_SUPERUSER: admin@example.com
        FIRST_SUPERUSER_PASSWORD: changethis
        # When running in SPCS, use OAuth token-based auth (auto-injected)
        SNOWFLAKE_AUTH_TYPE: oauth
      readinessProbe:
        port: 8000
        path: /api/v1/health
      resources:
        requests:
          cpu: "0.5"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
  endpoints:
    - name: fastapi
      port: 8000
      public: true
